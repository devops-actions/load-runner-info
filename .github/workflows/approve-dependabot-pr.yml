name: "Approve Dependabot PR's" 
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: devops-actions/.github/.github/workflows/approve-dependabot-pr.yml@f2b5c26c77264c245360c3f1f2d279947cc86503 # v1.2.0
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
