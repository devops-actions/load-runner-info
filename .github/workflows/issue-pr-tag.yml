name: "Issue/PR Tag"

# Trigger workflow when issues or pull requests are opened/edited,
# or when this workflow file is modified
on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  notify:
    uses: devops-actions/.github/.github/workflows/issue-pr-tag.yml@bb1b429a44f5ffc7d548bd55f4f792a2de7ab083 # main
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      org_name: ${{ vars.FIXED_ORG_NAME }}
      tag_team: ${{ vars.TAG_TEAM }}
      issue: ${{ github.event.issue.number }}
      pr: ${{ github.event.pull_request.number }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
